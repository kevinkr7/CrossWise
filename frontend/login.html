<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CrossWise</title>
  <meta name="description" content="Sign in to CrossWise to access the maize hybrid prediction tool.">
  <link rel="icon" type="image/png" href="assets/icons/leaf.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">

  <!-- ── Left: Form ──────────────────────────────────────────────────────── -->
  <div class="auth-panel">
    <div class="auth-form-wrap">

      <a href="index.html" class="auth-back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back to home
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">
        Don't have an account? <a href="register.html">Create one free</a>
      </p>

      <form class="auth-form" id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-input"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <div id="login-error" class="form-error" role="alert" aria-live="assertive"></div>

        <button type="submit" class="btn btn--primary auth-submit" id="login-btn">
          Sign in
        </button>

      </form>

      <p class="auth-footer-note" style="margin-top: var(--s4); font-size: var(--t-xs); color: var(--faint);">
        Demo: use any registered email &amp; password, or <a href="register.html">register first</a>.
      </p>

    </div>
  </div>

  <!-- ── Right: Botanical Illustration ──────────────────────────────────── -->
  <div class="auth-illustration" aria-hidden="true">

    <!-- SVG botanical decoration -->
    <div class="auth-illustration-svg">
      <svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <!-- Main stem -->
        <path d="M140 260 C140 200 140 160 140 80" stroke="rgba(175,201,178,.4)" stroke-width="2" stroke-linecap="round"/>
        <!-- Left branches -->
        <path d="M140 200 C120 190 95 175 70 180" stroke="rgba(175,201,178,.3)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M140 160 C115 145 90 130 60 140" stroke="rgba(175,201,178,.3)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M140 120 C118 105 100 95 75 105" stroke="rgba(175,201,178,.25)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Right branches -->
        <path d="M140 185 C160 175 185 165 210 172" stroke="rgba(175,201,178,.3)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M140 145 C168 130 192 120 220 130" stroke="rgba(175,201,178,.3)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M140 108 C163 93 185 84 205 96" stroke="rgba(175,201,178,.25)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Leaf shapes left -->
        <ellipse cx="62" cy="178" rx="22" ry="10" fill="rgba(175,201,178,.2)" transform="rotate(-30 62 178)"/>
        <ellipse cx="52" cy="137" rx="24" ry="10" fill="rgba(175,201,178,.18)" transform="rotate(-40 52 137)"/>
        <ellipse cx="68" cy="102" rx="18" ry="8" fill="rgba(175,201,178,.15)" transform="rotate(-25 68 102)"/>
        <!-- Leaf shapes right -->
        <ellipse cx="218" cy="170" rx="22" ry="10" fill="rgba(175,201,178,.2)" transform="rotate(30 218 170)"/>
        <ellipse cx="228" cy="128" rx="24" ry="10" fill="rgba(175,201,178,.18)" transform="rotate(40 228 128)"/>
        <ellipse cx="212" cy="94" rx="18" ry="8" fill="rgba(175,201,178,.15)" transform="rotate(25 212 94)"/>
        <!-- Top flower/bud -->
        <circle cx="140" cy="74" r="16" fill="rgba(175,201,178,.25)" stroke="rgba(175,201,178,.4)" stroke-width="1.5"/>
        <circle cx="140" cy="74" r="8" fill="rgba(175,201,178,.4)"/>
        <!-- Decorative dots -->
        <circle cx="70" cy="180" r="3" fill="rgba(175,201,178,.5)"/>
        <circle cx="52" cy="139" r="3" fill="rgba(175,201,178,.5)"/>
        <circle cx="218" cy="172" r="3" fill="rgba(175,201,178,.5)"/>
        <circle cx="228" cy="130" r="3" fill="rgba(175,201,178,.5)"/>
        <!-- Ground roots (subtle) -->
        <path d="M140 260 C130 255 115 258 100 265" stroke="rgba(175,201,178,.2)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M140 260 C150 255 165 258 180 265" stroke="rgba(175,201,178,.2)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="auth-quote">
      <p class="auth-quote__text">"The future of food security lies in understanding the language of DNA."</p>
      <p class="auth-quote__attr">— CrossWise Research Team</p>
    </div>

  </div>

</div><!-- auth-page -->

<script src="js/auth.js?v=2"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) { window.location.href = 'upload.html'; }

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');

    errorEl.textContent = '';
    errorEl.classList.remove('visible');

    if (!email || !password) {
      errorEl.textContent = 'Please fill in both fields.';
      errorEl.classList.add('visible');
      return;
    }

    btn.textContent = 'Signing in…';
    btn.disabled = true;

    const result = await loginUser(email, password);

    if (result.ok) {
      btn.textContent = '✓ Success!';
      setTimeout(() => { window.location.href = 'upload.html'; }, 500);
    } else {
      errorEl.textContent = result.error;
      errorEl.classList.add('visible');
      btn.textContent = 'Sign in';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
