services:
  - type: web
    name: crosswise-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/init_model.py
    startCommand: (test -d backend && cd backend || true) && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
