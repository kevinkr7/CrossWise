# ==============================================================================
# CrossWise API Reverse Proxy Configuration (Nginx)
# Place in: /etc/nginx/sites-available/crosswise (or add to your existing site)
# ==============================================================================

server {
    listen 80;
    server_name api.yourdomain.com; # <-- Replace with your subdomain or server IP

    # Increase upload limit for genomic SNP datasets
    client_max_body_size 50M;

    location / {
        # Instant CORS preflight response for OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for ML model predictions and SHAP calculations
        proxy_connect_timeout 180s;
        proxy_send_timeout    180s;
        proxy_read_timeout    300s;
    }
}

