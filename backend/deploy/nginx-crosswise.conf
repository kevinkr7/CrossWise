# ==============================================================================
# CrossWise API Reverse Proxy Configuration (Nginx)
# Place in: /etc/nginx/sites-available/crosswise (or add to your existing site)
# ==============================================================================

server {
    listen 80;
    server_name api.yourdomain.com; # <-- Replace with your subdomain or server IP

    # Increase upload limit for genomic SNP datasets
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for ML model predictions and SHAP calculations
        proxy_connect_timeout 180s;
        proxy_send_timeout    180s;
        proxy_read_timeout    300s;
    }
}
