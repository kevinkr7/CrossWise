# ==============================================================================
# CrossWise API Reverse Proxy Configuration (Apache / httpd)
# Place in: /etc/apache2/sites-available/crosswise.conf (Ubuntu)
#       or: /etc/httpd/conf.d/crosswise.conf (Oracle Linux)
# Enable modules first: sudo a2enmod proxy proxy_http headers ssl
# ==============================================================================

<VirtualHost *:80>
    ServerName api.yourdomain.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/ timeout=300
    ProxyPassReverse / http://127.0.0.1:5000/

    # Allow large CSV uploads
    LimitRequestBody 52428800

    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
