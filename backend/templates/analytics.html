{% extends "base.html" %}

{% block title %}Analytics — BreedAI Framework{% endblock %}

{% block content %}
<div class="container" style="max-width:1100px;margin:var(--s6) auto">

  <div class="page-header" data-reveal>
    <div class="page-header__eyebrow"><span class="tag">Analytics</span></div>
    <h1 class="page-header__title">Model & Dataset Analytics</h1>
    <p class="page-header__sub">Performance metrics, training split visualization, and trait distribution analysis.</p>
  </div>

  <div id="model-metrics" class="mb-4" data-reveal>
    <div class="card" style="height:150px">
      <div class="skeleton" style="height:100%;border-radius:var(--r-lg)"></div>
    </div>
  </div>

  <div id="split-chart" class="mb-4" data-reveal data-reveal-delay="1"></div>

  <div class="card mb-4" data-reveal data-reveal-delay="2">
    <div class="card__header">
      <div class="card__title">Dataset Overview</div>
    </div>
    <div id="dataset-stats" class="mt-4"></div>
  </div>

  <div data-reveal data-reveal-delay="3">
    <div id="trait-distributions"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
{% endblock %}
